<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script> <!-- jQuery Eklendi -->
    <style>
        body {
            display: flex;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }
        .sidebar {
            width: 250px;
            height: 100vh; /* Tam ekran boyutu kadar olacak */
            background: #343a40;
            color: white;
            padding: 15px;
            position: fixed;
            transition: all 0.3s;
            overflow-y: auto; /* Dikey kaydırmayı aç */
            scrollbar-width: thin; /* Firefox için scrollbar ince yap */
            scrollbar-color: #28a745 #343a40; /* Scroll rengini yeşil yap */
        }
            .sidebar::-webkit-scrollbar {
        width: 8px; /* Scroll çubuğu genişliği */
        }
            .sidebar::-webkit-scrollbar-thumb {
                background-color: #28a745; /* Scroll çubuğu rengi */
                border-radius: 10px;
        }
            .sidebar::-webkit-scrollbar-track {
                background: #343a40; /* Scroll arka planı */

        }


        .sidebar h4 {
            text-align: center;
            margin-bottom: 20px;
        }
        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px;
            border-radius: 5px;
            transition: background 0.3s, transform 0.2s;
            cursor: pointer;
        }
        .sidebar a:hover {
            background: #28a745;
            transform: translateX(5px);
        }
        .content {
            margin-left: 250px;
            padding: 20px;
            flex-grow: 1;
            width: 100%;
        }
        .submenu {
            display: none;
            padding-left: 15px;
        }
        .submenu a {
            font-size: 14px;
            padding: 5px 10px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h4>📌 Menü</h4>
        <a href="{% url 'dashboard_home' %}">🏠 Ana Sayfa</a>
        <a href="#" id="toggleGeneralDefinitions">📂 Genel Tanımlamalar ⬇</a>
        <div class="submenu" id="generalDefinitionsList">
    {% for model in model_names %}
        <a href="{% url 'model_data' model=model %}">{{ model }}</a>
    {% empty %}
        <a href="#">Tanımlı model bulunamadı.</a>
    {% endfor %}

    <div class="content">
        <h1>Dashboard</h1>
        <p>Burada yönetim panelleri, raporlar ve veri analizleri olacak.</p>
    </div>

    <script>
        $(document).ready(function() {
            $("#toggleGeneralDefinitions").click(function() {
                $("#generalDefinitionsList").slideToggle();
            });
        });
    </script>

</body>
</html>
