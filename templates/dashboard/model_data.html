
{% load custom_filters %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ model }} Verileri</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>📌 {{ model|title }} Verileri</h2>
        <table class="table table-striped">
            <thead>
                <tr>
                    {% for field in field_names %}
                        <th>{{ field }}</th>
                    {% endfor %}
                </tr>
            </thead>
            <tbody>
                {% for object in objects %}
                    <tr>
                        {% for key in field_keys %}
                            <td>{{ object|getattr_custom:key }}</td>

                        {% endfor %}
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="{{ field_names|length }}" class="text-center">Bu modelde veri bulunamadı.</td>
                    </tr>
                {% endfor %}
            </tbody>

        </table>
        <br>
        <a href="{% url 'dashboard_home' %}" class="btn btn-primary">Geri Dön</a>
    </div>
</body>
</html>
