{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Giriş / Kayıt{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <!-- Özel Auth Sayfası CSS -->
    <link rel="stylesheet" href="{% static 'accounts/base_auth/css/base_auth.css' %}">
</head>

<body>

<div class="auth-wrapper">
    <div class="auth-card">
        {% if site_logo %}
            <img src="{{ site_logo }}" class="logo" alt="Logo">
        {% else %}
            <img src="{% static '/onlinecustoms.png' %}" class="logo" alt="Logo">
        {% endif %}

        <div class="auth-title">{% block form_title %}Hoş Geldiniz{% endblock %}</div>

        {% block content %}
        <!-- Form içerikleri buraya -->
        {% endblock %}
    </div>
</div>

</body>
</html>
