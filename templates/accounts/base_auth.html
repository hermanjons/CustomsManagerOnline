{% load static %}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Giriş / Kayıt{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts (opsiyonel) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #f1f3f5;
            font-family: 'Inter', sans-serif;
        }
        .auth-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            background: white;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }
        .auth-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 25px;
            text-align: center;
        }
        .logo {
            max-width: 120px;
            margin: 0 auto 20px;
            display: block;
        }
    </style>
</head>

<body>

<div class="auth-wrapper">
    <div class="auth-card">
        {% if site_logo %}
            <img src="{{ site_logo }}" class="logo" alt="Logo">
        {% else %}
            <img src="{% static 'media/onlinecustoms.png' %}" class="logo" alt="Logo">
        {% endif %}

        <div class="auth-title">{% block form_title %}Hoş Geldiniz{% endblock %}</div>

        {% block content %}
        <!-- Form içerikleri buraya -->
        {% endblock %}
    </div>
</div>

</body>
</html>
