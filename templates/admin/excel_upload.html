{% extends "admin/change_list.html" %}
{% load static %}

{% block content %}
<div style="margin-bottom: 10px;">
    <button id="openExcelModal" class="button" style="background:green; color:white; padding:10px; border-radius:5px;">
        📤 Excel ile Yükle
    </button>
</div>

<div id="excelUploadModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Excel Dosyanızı Yükleyin</h2>

        <form id="excelUploadForm" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="file" name="excel_file" id="excelFileInput" accept=".csv, .xlsx" required>
            <br><br>
            <button type="submit" class="button">📤 Yüklemeye Başla</button>
        </form>

        <div id="progressContainer" class="progress mt-3" style="height: 25px; display: none; margin-top: 20px;">
            <div id="progressBar" class="progress-bar" role="progressbar" style="width: 0%;">0%</div>
        </div>

        <div id="uploadMessage" style="margin-top: 15px;"></div>
    </div>
</div>

{{ block.super }}

<script>
document.addEventListener("DOMContentLoaded", function() {
    var modal = document.getElementById("excelUploadModal");
    var btn = document.getElementById("openExcelModal");
    var span = document.getElementsByClassName("close")[0];
    var form = document.getElementById("excelUploadForm");
    var messageDiv = document.getElementById("uploadMessage");
    var progressContainer = document.getElementById("progressContainer");
    var progressBar = document.getElementById("progressBar");

    var fakeProgress = 0;
    var fakeProgressInterval;

    btn.onclick = function() {
        modal.style.display = "block";
    };

    span.onclick = function() {
        modal.style.display = "none";
        messageDiv.innerHTML = "";
        resetProgress();
    };

    window.onclick = function(event) {
        if (event.target == modal) {
            modal.style.display = "none";
            messageDiv.innerHTML = "";
            resetProgress();
        }
    };

    function startFakeProgress() {
        fakeProgress = 0;
        progressBar.style.width = "0%";
        progressBar.innerText = "0%";
        fakeProgressInterval = setInterval(() => {
            if (fakeProgress < 95) {
                fakeProgress += Math.floor(Math.random() * 5) + 1;
                if (fakeProgress > 95) fakeProgress = 95;
                progressBar.style.width = fakeProgress + "%";
                progressBar.innerText = fakeProgress + "%";
            }
        }, 500);
    }

    function finishFakeProgress() {
        clearInterval(fakeProgressInterval);
        progressBar.style.width = "100%";
        progressBar.innerText = "100%";
    }

    function resetProgress() {
        clearInterval(fakeProgressInterval);
        progressBar.style.width = "0%";
        progressBar.innerText = "0%";
    }

    form.onsubmit = function(event) {
        event.preventDefault();

        var formData = new FormData(form);
        var modelName = "{{ model_name }}";

        progressContainer.style.display = "block";
        resetProgress();
        startFakeProgress();

        fetch("{% url 'customs_general:upload_excel' model_name %}", {
            method: "POST",
            body: formData,
        })
        .then(response => response.json())
        .then(data => {
            finishFakeProgress();
            if (data.success) {
                messageDiv.innerHTML = "<span style='color:green;'>✅ " + data.message + "</span>";

                if (data.failed_rows_count > 0) {
                    messageDiv.innerHTML += `
                        <br><span style='color:red;'>⚠️ ${data.failed_rows_count} satırda hata oluştu!</span>
                        <br><a href="${data.failed_rows_download_url}" class="button" style="margin-top:10px; display:inline-block; background:red; color:white; padding:8px 15px; border-radius:5px;">📥 Hatalı Satırları İndir</a>
                    `;
                }
            } else {
                messageDiv.innerHTML = "<span style='color:red;'>❌ Hata: " + data.error + "</span>";
            }
        })
        .catch(error => {
            finishFakeProgress();
            messageDiv.innerHTML = "<span style='color:red;'>❌ Bir hata oluştu!</span>";
        });
    };
});
</script>

<style>
.modal { display: none; position: fixed; z-index: 9999; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4); }
.modal-content { background-color: #fefefe; margin: 10% auto; padding: 20px; border: 1px solid #888; width: 50%; border-radius: 10px; text-align: center; }
.close { color: #aaa; float: right; font-size: 28px; font-weight: bold; }
.close:hover, .close:focus { color: black; text-decoration: none; cursor: pointer; }
.progress { background-color: #e9ecef; border-radius: 10px; overflow: hidden; }
.progress-bar { background-color: green; height: 100%; text-align: center; color: white; font-weight: bold; transition: width 0.6s ease; }
</style>

{% endblock %}
