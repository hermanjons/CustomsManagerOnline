{% extends "base.html" %}
{% load widget_tweaks %}

{% block title %}
    Yeni Ürün Modeli Ekle
{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-success text-white">
            <h3 class="card-title mb-0">Yeni Ürün Modeli Ekle</h3>
        </div>
        <div class="card-body">
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="{{ form.product_model.id_for_label }}" class="form-label">Ürün Modeli</label>
                    {% render_field form.product_model class="form-control" %}
                </div>
                <div class="mb-3">
                    <label for="{{ form.brand.id_for_label }}" class="form-label">Marka</label>
                    {% render_field form.brand class="form-control" %}
                </div>
                <button type="submit" class="btn btn-success">
                    <i class="material-icons" style="vertical-align: middle;">add</i> Ürün Modelini Ekle
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
